# Installed as /etc/nginx/conf.d/arizon-common.conf (shared settings for the Arizon Yadak site)
server_tokens off;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml application/manifest+json;
map $http_upgrade $connection_upgrade { default upgrade; "" ""; }
